# Render Infrastructure as Code Blueprint
# Deploy backend FastAPI service and managed PostgreSQL database
services:
  # FastAPI Backend Web Service
  - type: web
    name: travel-planner-api
    runtime: python
    rootDir: backend
    plan: starter
    region: oregon
    buildCommand: "pip install --no-cache-dir -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: travel-planner-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: TRUST_ALL_PROXIES
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_API_KEY
        sync: false
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_AUTH_PER_MINUTE
        value: "5"
      - key: RATE_LIMIT_ANONYMOUS_PER_MINUTE
        value: "10"
      - key: RATE_LIMIT_USER_PER_MINUTE
        value: "20"
      - key: TRAVEL_PLANS_PER_USER_PER_DAY
        value: "10"
      - key: MAX_CONCURRENT_PLANS_TOTAL
        value: "3"
      - key: DAILY_LLM_BUDGET_USD
        value: "2.00"
      - key: MONTHLY_LLM_BUDGET_USD
        value: "20.00"

databases:
  # Managed PostgreSQL Database
  - name: travel-planner-db
    databaseName: travel_planner
    user: travel_user
    plan: starter
    region: oregon
    postgresMajorVersion: 16
